services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resa_user
      POSTGRES_PASSWORD: resa_password
      POSTGRES_DB: resa_db
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  postgres_data:
